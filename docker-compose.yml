services:
  put-kompendium:
    build:
      context: .
      dockerfile: Dockerfile
    image: put-kompendium:latest
    container_name: put-kompendium
    restart: unless-stopped
    ports:
      - "${PORT:-3456}:3456"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3456
      STUDY_DB_PATH: /app/data/study.db
      TRUST_PROXY: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    volumes:
      - study_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3456/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  study_data:
